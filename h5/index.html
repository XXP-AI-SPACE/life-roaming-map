<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生漫游地图 · 体验版</title>
<style>
  :root{
    --paper:#F7F4EE;
    --card:#FFFFFF;
    --ink:#2C2822;
    --ink-2:#4A4238;
    --muted:#8C8275;
    --muted-2:#A79C8D;
    --line:#F1EADD;
    --accent:#A8623A;
    --accent-soft:#C98A5E;
    --lit:#D79E58;
    --lit-deep:#AE6231;
    --unlit:#EAE4D8;
    --stroke:#DED5C5;
    --shadow:0 6px 24px rgba(90,70,40,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#E9E2D4;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    position:relative;
    width:100%; max-width:430px;
    height:100dvh;
    background:var(--paper);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  @media (min-width:520px){
    .phone{
      height:min(900px, 94dvh);
      border-radius:30px;
      box-shadow:0 30px 80px rgba(60,45,30,.20), 0 2px 0 rgba(255,255,255,.6) inset;
    }
  }

  /* 头部 */
  header{
    padding:calc(18px + env(safe-area-inset-top)) 22px 6px;
    flex:none;
  }
  header.hide{display:none;}
  .brand{font-size:23px; font-weight:600; letter-spacing:.5px;}
  .stats{margin-top:5px; font-size:12.5px; color:var(--muted); letter-spacing:.3px;}

  main{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  .view{display:none; padding-bottom:24px;}
  .view.active{display:block; animation:fade .22s ease;}
  @keyframes fade{from{opacity:0} to{opacity:1}}

  /* 地图 */
  .map-card{position:relative; margin:2px 2px 0;}
  svg#map{display:block; width:100%; height:auto;}
  .prov{
    fill:var(--unlit);
    stroke:var(--stroke);
    stroke-width:.7;
    stroke-linejoin:round;
    transition:fill .18s ease, stroke .18s ease;
    cursor:pointer;
  }
  .prov:hover{fill:#E1D8C7;}
  .prov.lit{fill:var(--lit); stroke:#BE8443;}
  .prov.lit:hover{fill:#CE9450;}
  .prov.sel{fill:var(--lit-deep); stroke:#8C4C22;}
  .prov.nohit{pointer-events:none;}
  .prov.jd{fill:#E6DECD; stroke:#C0B49A; stroke-width:.85;}
  .plabel{
    font-size:24px; fill:#9A8F80; text-anchor:middle; dominant-baseline:middle;
    pointer-events:none; font-weight:400; letter-spacing:.5px;
    transition:fill .18s ease;
  }
  .plabel[data-code]{pointer-events:auto; cursor:pointer;}
  .plabel.lit{fill:#553718; font-weight:600;}
  .plabel.sel{fill:#3A2312; font-weight:700;}
  .pdot{fill:#B9AE9C; transition:fill .18s ease;}
  .pdot.lit{fill:var(--lit-deep);}
  .phit{fill:transparent; cursor:pointer;}
  .map-tip{
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:var(--muted-2); letter-spacing:.5px; pointer-events:none;
  }
  .legend{display:flex; align-items:center; gap:16px; padding:2px 24px 0;}
  .lg{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:50%;}
  .dot.lit{background:var(--lit);}
  .dot.un{background:var(--unlit); border:1px solid var(--stroke);}
  .source{margin-left:auto; font-size:10px; color:#BDB2A0;}

  /* 最近一段 */
  .recent{margin:14px 16px 0;}
  .sec-label{font-size:10.5px; letter-spacing:2px; color:var(--muted-2); margin:0 4px 8px;}
  .recent-card{
    display:flex; gap:14px; align-items:center;
    background:var(--card); border-radius:18px; padding:12px;
    box-shadow:var(--shadow); cursor:pointer;
  }
  .recent-card img{width:76px; height:76px; border-radius:12px; object-fit:cover; background:#EFE8DA; flex:none;}
  .recent-body{min-width:0;}
  .recent-body h4{margin:0; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .recent-body p{margin:5px 0 0; font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* 足迹 */
  .album-head{display:flex; align-items:flex-end; justify-content:space-between; padding:calc(20px + env(safe-area-inset-top)) 22px 2px;}
  .album-head h2{margin:0; font-size:22px; font-weight:600;}
  .album-head .n{font-size:12px; color:var(--muted);}
  .month{padding:20px 22px 8px; font-size:11px; letter-spacing:2px; color:var(--muted-2);}
  .list{padding:0 14px;}
  .card{
    display:flex; gap:14px; background:var(--card); border-radius:18px;
    padding:12px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .16s ease;
  }
  .card:active{transform:scale(.985);}
  .card img{width:92px; height:92px; border-radius:12px; object-fit:cover; background:#EFE8DA; flex:none;}
  .card-body{min-width:0; display:flex; flex-direction:column; justify-content:center;}
  .card-body h4{margin:0; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-body .meta{margin:5px 0 0; font-size:11.5px; color:var(--muted);}
  .card-body .note{
    margin:5px 0 0; font-size:11.5px; color:var(--muted-2); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-body .date{margin:6px 0 0; font-size:10.5px; color:#C0B6A5; letter-spacing:.5px;}
  .tail{text-align:center; font-size:10.5px; color:#C9BFAD; letter-spacing:2px; padding:16px 0 8px;}

  .empty{padding:64px 40px; text-align:center;}
  .empty h3{margin:0; font-size:15px; font-weight:600; color:#6B5B49;}
  .empty p{margin:10px 0 0; font-size:12px; color:var(--muted-2); line-height:1.8;}
  .empty .link{
    display:inline-block; margin-top:18px; font-size:12.5px; color:var(--accent);
    border-bottom:1px solid rgba(168,98,58,.35); padding-bottom:2px; cursor:pointer;
  }

  /* 底部导航 */
  nav.tabbar{
    flex:none; display:flex; align-items:center; justify-content:space-around;
    padding:6px 0 calc(8px + env(safe-area-inset-bottom));
    background:rgba(251,248,242,.96); backdrop-filter:blur(8px);
    border-top:1px solid rgba(222,213,197,.6);
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; color:#9A8F80; padding:4px 26px; cursor:pointer; letter-spacing:1px;
  }
  .tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.6;}
  .tab.on{color:var(--accent);}

  /* 悬浮按钮 */
  .fab{
    position:absolute; right:18px; bottom:calc(70px + env(safe-area-inset-bottom));
    height:46px; padding:0 20px; border-radius:23px;
    background:var(--accent); color:#FFF9F2; border:none;
    box-shadow:0 8px 22px rgba(168,98,58,.35);
    display:flex; align-items:center; gap:6px; font-size:13.5px; letter-spacing:1px;
    cursor:pointer; z-index:5; font-family:inherit;
  }
  .fab:active{transform:translateY(1px);}
  .fab .plus{font-size:19px; line-height:1; margin-top:-1px;}

  /* 弹层通用 */
  .overlay{position:absolute; inset:0; z-index:20; display:none;}
  .overlay.open{display:block;}
  .scrim{position:absolute; inset:0; background:rgba(44,40,34,.34); opacity:0; transition:opacity .24s ease;}
  .overlay.open .scrim{opacity:1;}

  /* 省份弹层 */
  #sheet{pointer-events:none;}
  #sheet.open{pointer-events:auto;}
  .sheet-panel{
    position:absolute; left:0; right:0; bottom:0;
    background:#FDFBF6; border-radius:24px 24px 0 0;
    box-shadow:0 -10px 40px rgba(60,45,30,.14);
    transform:translateY(102%); transition:transform .28s cubic-bezier(.22,.9,.28,1);
    padding:10px 22px calc(20px + env(safe-area-inset-bottom));
    max-height:74%; display:flex; flex-direction:column;
  }
  #sheet.open .sheet-panel{transform:translateY(0);}
  .grip{width:34px; height:4px; border-radius:2px; background:#E2D8C8; margin:0 auto 14px; flex:none;}
  .sheet-hd{display:flex; align-items:flex-start; justify-content:space-between; flex:none;}
  .sheet-hd h3{margin:0; font-size:18px; font-weight:600;}
  .sheet-hd p{margin:4px 0 0; font-size:11.5px; color:var(--muted);}
  .x{
    width:32px; height:32px; border-radius:50%; border:none; background:#F3ECE0;
    color:#8C8275; font-size:14px; line-height:1; cursor:pointer; flex:none; font-family:inherit;
  }
  .sheet-list{overflow-y:auto; margin:12px 0 14px; flex:1; min-height:0;}
  .mini{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .mini:last-child{border-bottom:none;}
  .mini img{width:46px; height:46px; border-radius:9px; object-fit:cover; background:#EFE8DA; flex:none;}
  .mini .t{font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mini .m{font-size:10.5px; color:var(--muted-2); margin-top:3px;}
  .sheet-empty{font-size:12.5px; color:var(--muted-2); padding:10px 0 16px;}

  .btn{
    width:100%; height:46px; border-radius:23px; border:none; cursor:pointer;
    background:var(--accent); color:#FFF9F2; font-size:14px; letter-spacing:2px;
    font-family:inherit; transition:opacity .18s ease;
  }
  .btn:disabled{background:#D9CEC0; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:#6B5B49; border:1px solid var(--stroke);}

  /* 新增面板 */
  #addView{background:var(--paper); z-index:30; transition:transform .3s cubic-bezier(.22,.9,.28,1); transform:translateY(100%); display:flex; flex-direction:column;}
  #addView.open{transform:translateY(0);}
  .panel-hd{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  }
  .panel-hd .title{font-size:16px; font-weight:600; letter-spacing:1px;}
  .panel-hd button{background:none; border:none; font-size:13.5px; color:var(--muted); cursor:pointer; font-family:inherit; padding:6px 4px;}
  .panel-hd .save{color:var(--accent); font-weight:600;}
  .panel-hd .save:disabled{color:#C9BFAD;}
  .panel-body{flex:1; overflow-y:auto; padding:4px 16px 30px;}

  .photo-box{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:18px;
    background:#EFE8DA; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .photo-box img{width:100%; height:100%; object-fit:cover;}
  .photo-box .ph-plus{font-size:30px; color:#C4B7A2; line-height:1;}
  .photo-box .ph-t{font-size:13.5px; color:var(--muted); margin-top:10px;}
  .photo-box .ph-s{font-size:11px; color:#B3A791; margin-top:4px;}
  .photo-chip{
    position:absolute; right:10px; bottom:10px; background:rgba(44,40,34,.55);
    color:#FFF9F2; font-size:11px; padding:4px 10px; border-radius:12px;
  }
  .form{margin-top:14px; background:var(--card); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);}
  .row{
    display:flex; align-items:center; min-height:52px; padding:0 16px;
    border-bottom:1px solid var(--line); gap:10px;
  }
  .row:last-child{border-bottom:none;}
  .row .k{width:42px; flex:none; font-size:13px; color:var(--muted);}
  .row select, .row input[type=date], .row input[type=text]{
    flex:1; border:none; outline:none; background:transparent; font-size:14.5px;
    color:var(--ink); font-family:inherit; min-width:0; appearance:none;
  }
  .row select{
    background-image:linear-gradient(45deg,transparent 50%,#C4B7A2 50%),linear-gradient(135deg,#C4B7A2 50%,transparent 50%);
    background-position:calc(100% - 8px) 50%, calc(100% - 4px) 50%;
    background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
    padding-right:16px;
  }
  .row select.placeholder{color:#C4B7A2;}
  .row.col{display:block; padding:14px 16px;}
  .row textarea{
    width:100%; border:none; outline:none; resize:none; background:transparent;
    font-size:14.5px; line-height:1.7; font-family:inherit; color:var(--ink); min-height:96px;
  }
  .row .cnt{text-align:right; font-size:10.5px; color:#C9BFAD;}
  .hint{margin:12px 4px 0; font-size:10.5px; color:#B3A791;}

  /* 详情 */
  #detailView{background:var(--paper); z-index:35; overflow-y:auto;}
  .detail-photo{width:100%; height:52%; min-height:300px; object-fit:cover; background:#EFE8DA; display:block;}
  .detail-body{padding:22px 22px 40px;}
  .detail-body h2{margin:0; font-size:23px; line-height:1.45; font-weight:600;}
  .detail-meta{margin-top:8px; font-size:12px; color:var(--muted);}
  .detail-note{margin-top:18px; font-size:15px; line-height:1.85; color:var(--ink-2); white-space:pre-wrap;}
  .detail-actions{margin-top:44px; display:flex; gap:12px;}
  .detail-actions .btn{height:44px; font-size:13.5px;}
  .back{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px;
    width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(44,40,34,.42); color:#FFF9F2; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .del{
    background:transparent; color:var(--accent); border:1px solid #E6D6C8;
  }

  /* toast */
  #toast{
    position:absolute; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%, 10px); background:rgba(44,40,34,.9); color:#FFF9F2;
    font-size:12.5px; padding:9px 16px; border-radius:18px; opacity:0;
    transition:opacity .2s ease, transform .2s ease; pointer-events:none; z-index:60;
    max-width:80%; text-align:center; line-height:1.5;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}
</style>
</head>
<body>
<div class="phone" id="phone">

  <header>
    <div class="brand">人生漫游地图</div>
    <div class="stats" id="stats">正在翻开你的地图…</div>
  </header>

  <main id="main">
    <!-- 地图 -->
    <section class="view active" id="viewMap">
      <div class="map-card">
        <svg id="map" viewBox="0 0 1000 979" preserveAspectRatio="xMidYMid meet" aria-label="中国地图"></svg>
        <div class="map-tip" id="mapTip" style="display:none">点一下省份，记下第一段旅程</div>
      </div>
      <div class="legend">
        <div class="lg"><span class="dot lit"></span>走过的省份</div>
        <div class="lg"><span class="dot un"></span>还没去过</div>
        <div class="source">地图数据：DataV.GeoAtlas</div>
      </div>
      <div class="recent" id="recentWrap" style="display:none">
        <div class="sec-label">最近一段</div>
        <div class="recent-card" id="recentCard"></div>
      </div>
    </section>

    <!-- 足迹 -->
    <section class="view" id="viewAlbum">
      <div class="album-head">
        <h2>足迹</h2>
        <div class="n" id="albumCount"></div>
      </div>
      <div id="albumBody"></div>
    </section>
  </main>

  <button class="fab" id="fab"><span class="plus">＋</span>记录</button>

  <nav class="tabbar">
    <div class="tab on" data-view="map">
      <svg viewBox="0 0 24 24"><path d="M9 3.5 3.5 5.5v15L9 18.5l6 2 5.5-2v-15l-5.5 2-6-2Z"/><path d="M9 3.5v15M15 5.5v15"/></svg>
      地图
    </div>
    <div class="tab" data-view="album">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="6" rx="1.6"/><rect x="3.5" y="13.5" width="17" height="6" rx="1.6"/></svg>
      足迹
    </div>
  </nav>

  <!-- 省份弹层 -->
  <div class="overlay" id="sheet">
    <div class="scrim" data-close="sheet"></div>
    <div class="sheet-panel">
      <div class="grip"></div>
      <div class="sheet-hd">
        <div>
          <h3 id="sheetTitle">省份</h3>
          <p id="sheetSub"></p>
        </div>
        <button class="x" data-close="sheet">✕</button>
      </div>
      <div class="sheet-list" id="sheetList"></div>
      <button class="btn" id="sheetAdd">在这里记录</button>
    </div>
  </div>

  <!-- 新增面板 -->
  <div class="overlay" id="addView">
    <div class="panel-hd">
      <button id="addCancel">取消</button>
      <div class="title">记下一段</div>
      <button class="save" id="addSave" disabled>保存</button>
    </div>
    <div class="panel-body">
      <div class="photo-box" id="photoBox">
        <div class="ph-plus">＋</div>
        <div class="ph-t">放一张照片</div>
        <div class="ph-s">相册或相机，一张就好</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">

      <div class="form">
        <div class="row"><span class="k">地点</span>
          <select id="selProv"></select>
          <select id="selCity" disabled></select>
        </div>
        <div class="row"><span class="k"></span>
          <select id="selDist" disabled></select>
        </div>
        <div class="row"><span class="k">日期</span>
          <input type="date" id="inpDate">
        </div>
        <div class="row col">
          <input type="text" id="inpTitle" maxlength="24" placeholder="一句话记住这里" style="width:100%">
          <div class="cnt" id="cnt">0/24</div>
        </div>
        <div class="row col">
          <textarea id="inpNote" maxlength="200" placeholder="发生了什么？和谁一起？"></textarea>
        </div>
      </div>
      <div class="hint">体验版把照片压缩后存在浏览器本地，只有这台设备看得见</div>
    </div>
  </div>

  <!-- 详情 -->
  <div class="overlay" id="detailView">
    <button class="back" id="detailBack">←</button>
    <img class="detail-photo" id="detailPhoto" alt="">
    <div class="detail-body">
      <h2 id="detailTitle"></h2>
      <div class="detail-meta" id="detailMeta"></div>
      <div class="detail-note" id="detailNote"></div>
      <div class="detail-actions">
        <button class="btn ghost del" id="detailDel">删除这段记忆</button>
        <button class="btn ghost" id="detailClose">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

/* ============ 工具 ============ */
const NS = 'http://www.w3.org/2000/svg';
const STORE_KEY = 'lrm.memories.v1';
const PROV_BY_CODE = {};
MAP.provinces.forEach(p => { PROV_BY_CODE[p.adcode] = p; });
// 直辖市/特区标签偏移（避开京津、港澳拥挤区）
const TINY_OFFSET = {
  110000: { dx: -11, dy: 0, anchor: 'end' },
  120000: { dx: 12, dy: 2, anchor: 'start' },
  310000: { dx: 12, dy: 0, anchor: 'start' },
  810000: { dx: 12, dy: 0, anchor: 'start' },
  820000: { dx: -12, dy: 0, anchor: 'end' },
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normProv(name) {
  if (!name) return '';
  return String(name).trim().replace(/(特别行政区|自治区|省|市)$/, '').replace(/(壮族|回族|维吾尔)$/, '');
}
function provByShort(short) {
  return MAP.provinces.find(p => p.short === short) || null;
}
function fmtDate(d) {
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function monthLabel(ym) {
  const [y, m] = ym.split('-');
  return y + ' 年 ' + Number(m) + ' 月';
}
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============ 存储 ============ */
function loadMemories() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function persist(list) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    toast('浏览器本地存储满了，删几条旧记忆再试');
    return false;
  }
}
let memories = loadMemories().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));

/* ============ 地图 ============ */
const svg = $('#map');

function buildMap() {
  const frag = document.createDocumentFragment();
  // 先画常规省份，再画被包裹的直辖市/特区，最后画南海诸岛
  const tiny = [110000, 120000, 310000, 810000, 820000];
  const order = MAP.provinces.filter(p => p.adcode !== '100000_JD' && tiny.indexOf(p.adcode) < 0)
    .concat(MAP.provinces.filter(p => tiny.indexOf(p.adcode) >= 0))
    .concat(MAP.provinces.filter(p => p.adcode === '100000_JD'));

  order.forEach(p => {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', p.d);
    path.setAttribute('class', 'prov' + (p.adcode === '100000_JD' ? ' nohit jd' : ''));
    path.dataset.code = p.adcode;
    frag.appendChild(path);
  });

  // 标签
  MAP.provinces.forEach(p => {
    if (p.adcode === '100000_JD') {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.label[0]);
      t.setAttribute('y', p.label[1]);
      t.setAttribute('class', 'plabel');
      t.setAttribute('font-size', '20');
      t.textContent = '南海诸岛';
      frag.appendChild(t);
      return;
    }
    if (p.tiny) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', p.label[0]);
      c.setAttribute('cy', p.label[1]);
      c.setAttribute('r', '5');
      c.setAttribute('class', 'pdot');
      c.dataset.code = p.adcode;
      frag.appendChild(c);

      const off = TINY_OFFSET[p.adcode] || { dx: 12, dy: 0, anchor: 'start' };
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.label[0] + off.dx);
      t.setAttribute('y', p.label[1] + off.dy);
      t.setAttribute('class', 'plabel');
      t.setAttribute('font-size', '19');
      t.style.textAnchor = off.anchor;
      t.dataset.code = p.adcode;
      t.textContent = p.short;
      frag.appendChild(t);

      const hit = document.createElementNS(NS, 'circle');
      hit.setAttribute('cx', p.label[0]);
      hit.setAttribute('cy', p.label[1]);
      hit.setAttribute('r', '30');
      hit.setAttribute('class', 'phit');
      hit.dataset.code = p.adcode;
      frag.appendChild(hit);
      return;
    }
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', p.label[0]);
    t.setAttribute('y', p.label[1]);
    t.setAttribute('class', 'plabel');
    t.dataset.code = p.adcode;
    t.textContent = p.short;
    frag.appendChild(t);
  });

  svg.appendChild(frag);
}

function litCounts() {
  const lit = {};
  memories.forEach(m => {
    const p = provByShort(normProv(m.province));
    if (p) lit[p.adcode] = (lit[p.adcode] || 0) + 1;
  });
  return lit;
}

let selected = null;
function renderMap() {
  const lit = litCounts();
  svg.querySelectorAll('.prov').forEach(el => {
    const on = !!lit[el.dataset.code];
    el.classList.toggle('lit', on);
    el.classList.toggle('sel', el.dataset.code === selected);
  });
  svg.querySelectorAll('.plabel[data-code]').forEach(el => {
    const on = !!lit[el.dataset.code];
    el.classList.toggle('lit', on);
    el.classList.toggle('sel', el.dataset.code === selected);
  });
  svg.querySelectorAll('.pdot').forEach(el => {
    el.classList.toggle('lit', !!lit[el.dataset.code]);
  });

  const n = Object.keys(lit).length;
  $('#stats').textContent = memories.length
    ? '已点亮 ' + n + ' 个省份 · ' + memories.length + ' 段记忆'
    : '一张地图，装下你走过的路';
  $('#mapTip').style.display = (!memories.length && state.view === 'map') ? 'block' : 'none';

  renderRecent();
}

function renderRecent() {
  const wrap = $('#recentWrap');
  if (!memories.length) { wrap.style.display = 'none'; return; }
  const m = memories[0];
  wrap.style.display = 'block';
  $('#recentCard').innerHTML =
    '<img src="' + m.photo + '" alt="">' +
    '<div class="recent-body"><h4>' + esc(m.title) + '</h4>' +
    '<p>' + esc([m.city || m.province, m.district].filter(Boolean).join(' · ')) + ' · ' + esc(m.date) + '</p></div>';
  $('#recentCard').onclick = () => openDetail(m.id);
}

/* ============ 足迹 ============ */
function renderAlbum() {
  const body = $('#albumBody');
  $('#albumCount').textContent = memories.length ? memories.length + ' 段记忆' : '';
  if (!memories.length) {
    body.innerHTML =
      '<div class="empty"><h3>还没有记录</h3>' +
      '<p>去地图上点亮第一个省份<br>一张照片，一句话，就够了</p>' +
      '<div class="link" id="seedDemo">先看看示例 →</div></div>';
    const seed = $('#seedDemo');
    if (seed) seed.onclick = addDemoData;
    return;
  }

  const groups = [];
  let cur = null;
  memories.forEach(m => {
    const ym = (m.date || '').slice(0, 7) || '未标注';
    const label = ym === '未标注' ? ym : monthLabel(ym);
    if (!cur || cur.label !== label) { cur = { label, items: [] }; groups.push(cur); }
    cur.items.push(m);
  });

  body.innerHTML = groups.map(g =>
    '<div class="month">' + esc(g.label) + '</div><div class="list">' +
    g.items.map(m =>
      '<article class="card" data-id="' + m.id + '">' +
        '<img src="' + m.photo + '" alt="">' +
        '<div class="card-body">' +
          '<h4>' + esc(m.title) + '</h4>' +
          '<p class="meta">' + esc([m.city || m.province, m.district].filter(Boolean).join(' · ')) + '</p>' +
          (m.note ? '<p class="note">' + esc(m.note) + '</p>' : '') +
          '<p class="date">' + esc(m.date) + '</p>' +
        '</div>' +
      '</article>'
    ).join('') +
    '</div>'
  ).join('') + '<div class="tail">— 就记到这里 —</div>';

  body.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDetail(el.dataset.id);
  });
}

/* ============ 视图切换 ============ */
const state = { view: 'map' };
function switchView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view' + v.charAt(0).toUpperCase() + v.slice(1)));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.view === v));
  document.querySelector('header').classList.toggle('hide', v !== 'map');
  $('#main').scrollTop = 0;
  if (v === 'map') { renderMap(); } else { renderAlbum(); }
}
document.querySelectorAll('.tab').forEach(el => {
  el.onclick = () => switchView(el.dataset.view);
});

/* ============ 省份弹层 ============ */
let sheetProv = null;
function openSheet(code) {
  const p = PROV_BY_CODE[code];
  if (!p) return;
  sheetProv = p;
  selected = code;
  renderMap();

  const list = memories.filter(m => normProv(m.province) === p.short);
  $('#sheetTitle').textContent = p.name;
  $('#sheetSub').textContent = list.length ? list.length + ' 段记忆' : '这里的空白，等你来填';

  const box = $('#sheetList');
  if (list.length) {
    box.innerHTML = list.slice(0, 5).map(m =>
      '<div class="mini" data-id="' + m.id + '">' +
        '<img src="' + m.photo + '" alt="">' +
        '<div><div class="t">' + esc(m.title) + '</div>' +
        '<div class="m">' + esc([m.city, m.district].filter(Boolean).join(' · ')) + ' · ' + esc(m.date) + '</div></div>' +
      '</div>'
    ).join('');
    box.querySelectorAll('.mini').forEach(el => {
      el.onclick = () => { closeSheet(); openDetail(el.dataset.id); };
    });
  } else {
    box.innerHTML = '<div class="sheet-empty">还没有在这里留下记忆。</div>';
  }
  $('#sheetAdd').onclick = () => { closeSheet(); openAdd(p.name); };
  $('#sheet').classList.add('open');
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  selected = null;
  renderMap();
}
svg.addEventListener('click', (e) => {
  const el = e.target.closest('[data-code]');
  if (!el) return;
  openSheet(el.dataset.code);
});
document.querySelectorAll('[data-close="sheet"]').forEach(el => { el.onclick = closeSheet; });

/* ============ 新增 ============ */
const addState = { photo: null, province: '', city: '', district: '', date: fmtDate(new Date()), preset: '' };

function fillProvSelect(presetName) {
  const selP = $('#selProv'), selC = $('#selCity'), selD = $('#selDist');
  const provs = Object.keys(PCA);
  selP.innerHTML = '<option value="">选择省份</option>' + provs.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
  selC.innerHTML = '<option value="">选择城市</option>';
  selD.innerHTML = '<option value="">选择区县</option>';
  selC.disabled = true; selD.disabled = true;
  if (presetName && PCA[presetName]) {
    selP.value = presetName;
    onProvChange(presetName);
  }
}

function onProvChange(name) {
  const selC = $('#selCity'), selD = $('#selDist');
  addState.province = name;
  addState.city = ''; addState.district = '';
  if (!name || !PCA[name]) {
    selC.innerHTML = '<option value="">选择城市</option>'; selC.disabled = true;
    selD.innerHTML = '<option value="">选择区县</option>'; selD.disabled = true;
    checkAddValid(); return;
  }
  const cities = Object.keys(PCA[name]);
  selC.innerHTML = '<option value="">选择城市</option>' + cities.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  selC.disabled = false;
  selD.innerHTML = '<option value="">选择区县</option>'; selD.disabled = true;
  checkAddValid();
}
function onCityChange(name) {
  const selD = $('#selDist');
  addState.city = name;
  addState.district = '';
  const dists = (addState.province && name && PCA[addState.province] && PCA[addState.province][name]) || [];
  if (!name || !dists.length) {
    selD.innerHTML = '<option value="">选择区县</option>'; selD.disabled = true;
    checkAddValid(); return;
  }
  selD.innerHTML = '<option value="">选择区县</option>' + dists.map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('');
  selD.disabled = false;
  checkAddValid();
}

$('#selProv').onchange = (e) => onProvChange(e.target.value);
$('#selCity').onchange = (e) => onCityChange(e.target.value);
$('#selDist').onchange = (e) => { addState.district = e.target.value; checkAddValid(); };
$('#inpDate').onchange = (e) => { addState.date = e.target.value || fmtDate(new Date()); };
$('#inpTitle').oninput = (e) => {
  $('#cnt').textContent = e.target.value.length + '/24';
  checkAddValid();
};

function checkAddValid() {
  const ok = !!addState.photo && !!addState.province && !!$('#inpTitle').value.trim();
  $('#addSave').disabled = !ok;
}

function openAdd(presetProvince) {
  addState.photo = null;
  addState.province = ''; addState.city = ''; addState.district = '';
  addState.date = fmtDate(new Date());
  addState.preset = presetProvince || '';
  $('#photoBox').innerHTML = '<div class="ph-plus">＋</div><div class="ph-t">放一张照片</div><div class="ph-s">相册或相机，一张就好</div>';
  $('#inpTitle').value = '';
  $('#inpNote').value = '';
  $('#cnt').textContent = '0/24';
  $('#inpDate').value = addState.date;
  fillProvSelect(presetProvince);
  checkAddValid();
  $('#addView').classList.add('open');
}
function closeAdd() {
  $('#addView').classList.remove('open');
}

$('#photoBox').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  compressImage(f, (dataUrl) => {
    addState.photo = dataUrl;
    const box = $('#photoBox');
    box.innerHTML = '<img src="' + dataUrl + '" alt=""><div class="photo-chip">重选</div>';
    checkAddValid();
  });
  e.target.value = '';
};

function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => toast('这张照片读不出来，换一张试试');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

$('#addSave').onclick = () => {
  const title = $('#inpTitle').value.trim();
  if (!addState.photo) return toast('先放一张照片吧');
  if (!addState.province) return toast('选一下地点');
  if (!title) return toast('写一句标题');

  const rec = {
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
    title,
    province: addState.province,
    city: addState.city || addState.province,
    district: addState.district || '',
    date: addState.date,
    note: $('#inpNote').value.trim(),
    photo: addState.photo,
    createdAt: Date.now(),
  };
  memories.unshift(rec);
  if (!persist(memories)) { memories.shift(); return; }
  closeAdd();
  switchView('map');
  toast('已记下');
};
$('#addCancel').onclick = closeAdd;
$('#fab').onclick = () => openAdd('');

/* ============ 详情 ============ */
let detailId = null;
function openDetail(id) {
  const m = memories.find(x => x.id === id);
  if (!m) return;
  detailId = id;
  $('#detailPhoto').src = m.photo;
  $('#detailTitle').textContent = m.title;
  $('#detailMeta').textContent = [m.province, m.city, m.district].filter(Boolean).join(' · ') + ' · ' + m.date;
  $('#detailNote').textContent = m.note || '';
  $('#detailView').classList.add('open');
  $('#detailView').scrollTop = 0;
}
function closeDetail() {
  $('#detailView').classList.remove('open');
  detailId = null;
}
$('#detailBack').onclick = closeDetail;
$('#detailClose').onclick = closeDetail;
$('#detailDel').onclick = () => {
  if (!detailId) return;
  const rec = memories.find(x => x.id === detailId);
  if (!confirm('删除「' + (rec ? rec.title : '这段记忆') + '」？删除后无法恢复。')) return;
  memories = memories.filter(x => x.id !== detailId);
  persist(memories);
  closeDetail();
  renderMap();
  renderAlbum();
  toast('已删除');
};

/* ============ 示例数据 ============ */
function demoPhoto(from, to, sun) {
  const svgStr = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + from + '"/><stop offset="100%" stop-color="' + to + '"/></linearGradient></defs>' +
    '<rect width="800" height="600" fill="url(#g)"/>' +
    '<circle cx="620" cy="150" r="58" fill="' + sun + '" opacity="0.9"/>' +
    '<path d="M0 470 L160 330 L300 430 L430 300 L560 420 L700 340 L800 430 L800 600 L0 600 Z" fill="#6B7F6E" opacity="0.5"/>' +
    '<path d="M0 520 L140 430 L280 500 L420 400 L580 510 L720 440 L800 500 L800 600 L0 600 Z" fill="#4E5F52" opacity="0.65"/>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
}
function addDemoData() {
  const demo = [
    { title: '洱海边的一个下午', province: '云南省', city: '大理白族自治州', district: '大理市', date: '2026-08-12', note: '风把云推着走，骑车绕了半圈，停下来喝了一杯冰咖啡。', photo: demoPhoto('#F3D9B1', '#B7C9D6', '#F6C77B') },
    { title: '骑楼下的牛肉火锅', province: '广东省', city: '汕头市', district: '金平区', date: '2026-05-03', note: '晚上十点才开锅，沙茶酱配胸口油，吃完沿老街走回酒店。', photo: demoPhoto('#F0C9A8', '#9FB0A3', '#F2A65A') },
    { title: '雨后的西湖', province: '浙江省', city: '杭州市', district: '西湖区', date: '2026-03-21', note: '断桥边人不多，柳树刚绿，雨停后湖面像一块旧镜子。', photo: demoPhoto('#DCE6E3', '#A8BBAE', '#EFE3C2') },
  ];
  const base = Date.now();
  demo.forEach((d, i) => {
    memories.push(Object.assign({ id: 'demo' + base + i, createdAt: base - i * 1000 }, d));
  });
  memories.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  persist(memories);
  renderMap();
  renderAlbum();
  toast('已放入 3 段示例，可随时删除');
}

/* ============ 启动 ============ */
buildMap();
renderMap();
renderAlbum();

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#detailView').classList.contains('open')) return closeDetail();
  if ($('#addView').classList.contains('open')) return closeAdd();
  if ($('#sheet').classList.contains('open')) return closeSheet();
});
</script>
